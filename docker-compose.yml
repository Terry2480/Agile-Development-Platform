services:
  db:
    image: postgres:16
    container_name: agilecampus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agilecampus
      POSTGRES_PASSWORD: agilecampus_dev
      POSTGRES_DB: agilecampus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
