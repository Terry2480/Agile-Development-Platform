<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>仓库分支现状</title>
  <desc>四条分支的时间线与关系，feature/dm-and-cloud-docs 为 14 小时前上传的分支</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="sans-serif">
    <rect x="60" y="24" width="560" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="80" y="44" fill="#444441" font-size="14" font-weight="500" dominant-baseline="central">main</text>
    <text x="80" y="64" fill="#5F5E5A" font-size="12" dominant-baseline="central">9 月 30 日 · 仅存一个早期登录系统提交，已 6 周未更新</text>
  </g>
  <g font-family="sans-serif">
    <rect x="60" y="124" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="80" y="144" fill="#0C447C" font-size="14" font-weight="500" dominant-baseline="central">terry/workplace</text>
    <text x="80" y="164" fill="#185FA5" font-size="12" dominant-baseline="central">10 月 14 日 · v4 工作台，下方分支的开发基座</text>
  </g>
  <path d="M340 180 L340 212" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="198" fill="#185FA5" font-size="12" font-family="sans-serif" dominant-baseline="central">基于 v4 增量开发</text>
  <g font-family="sans-serif">
    <rect x="60" y="224" width="560" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="80" y="244" fill="#993C1D" font-size="14" font-weight="500" dominant-baseline="central">feature/dm-and-cloud-docs</text>
    <text x="80" y="264" fill="#993C1D" font-size="12" dominant-baseline="central">11 月 14 日（14 小时前）· 33 个提交 / +1.47 万行，私聊 + 云文档 + 消息体验 v6.1</text>
  </g>
  <path d="M340 100 L340 108" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g font-family="sans-serif">
    <rect x="60" y="330" width="560" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="80" y="350" fill="#3C3489" font-size="14" font-weight="500" dominant-baseline="central">student/y123456-wq-workspace</text>
    <text x="80" y="370" fill="#534AB7" font-size="12" dominant-baseline="central">另一套架构（src/ + NextAuth）：飞书登录、AI 助手、Agent API、甘特、燃尽都在这里</text>
  </g>
  <line x1="40" y1="308" x2="640" y2="308" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="340" y="300" fill="#5F5E5A" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">两条产品线并行，架构互不兼容</text>
  <text x="340" y="410" fill="#5F5E5A" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">main 与 feature 分支已完全分叉：main 独有的登录提交从未合入该分支</text>
</svg>
